<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HelperChore | Account access</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet"><style>:root{font-size:20px}body{margin:0;background:#1E293B;color:#F8FAFC;font-family:'Plus Jakarta Sans',sans-serif}h1,h2{font-family:'Playfair Display',serif}label{display:block;margin-top:18px;font-weight:800}input,select{width:100%;min-height:52px;margin-top:7px;padding:10px;background:#F8FAFC!important;color:#1E293B!important;-webkit-text-fill-color:#1E293B!important;caret-color:#FF5A1F;border:2px solid #FF5A1F;font:inherit;font-size:1rem;opacity:1}input::placeholder{color:#475569;opacity:1}input:-webkit-autofill,input:-webkit-autofill:focus{-webkit-text-fill-color:#1E293B!important;box-shadow:0 0 0 1000px #F8FAFC inset!important}button,a{min-width:48px;min-height:48px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid #FF5A1F;outline-offset:3px}.password-row{display:flex;gap:8px;align-items:end}.password-row input{flex:1}.show{background:#1E293B;color:#F8FAFC;border:2px solid #FF5A1F;padding:10px}</style></head><body><header class="mx-auto max-w-5xl border-b-4 border-[#FF5A1F] px-6 py-6"><a href="/" class="font-extrabold tracking-widest">HELPER<span class="text-[#FF5A1F]">/</span>CHORE</a></header><main class="mx-auto grid max-w-5xl gap-10 px-6 py-12 md:grid-cols-2"><section class="bg-[#F8FAFC] p-8 text-[#1E293B]"><h1 class="text-5xl">Join the network.</h1><form id="register"><label for="name">Your name</label><input id="name" autocomplete="name" required><label for="password">Password, at least 8 characters</label><div class="password-row"><input id="password" type="password" autocomplete="new-password" minlength="8" required><button type="button" class="show" data-target="password">Show</button></div><label for="role">Your role</label><select id="role"><option value="SENIOR">Senior</option><option value="VOLUNTEER">Volunteer</option></select><label for="lat">Latitude</label><input id="lat" type="number" step="any" min="-90" max="90" required><label for="lon">Longitude</label><input id="lon" type="number" step="any" min="-180" max="180" required><label for="skills">Skills, separated by commas</label><input id="skills"><label for="certs">Certified skills, separated by commas</label><input id="certs"><button class="mt-7 w-full bg-[#FF5A1F] px-5 py-4 font-extrabold" type="submit">Create account</button></form></section><section class="border-l-4 border-[#FF5A1F] p-8"><h2 class="text-5xl">Welcome back.</h2><form id="login"><label for="loginName">Your name</label><input id="loginName" autocomplete="username" required><label for="loginPassword">Password</label><div class="password-row"><input id="loginPassword" type="password" autocomplete="current-password" minlength="8" required><button type="button" class="show" data-target="loginPassword">Show</button></div><button class="mt-7 w-full bg-[#FF5A1F] px-5 py-4 font-extrabold text-[#1E293B]" type="submit">Sign in</button></form><details class="mt-10"><summary class="cursor-pointer font-extrabold">Forgot your password?</summary><form id="reset" class="mt-4"><label for="resetName">Your name</label><input id="resetName" required><label for="recovery">Recovery code</label><input id="recovery" autocomplete="one-time-code" required><label for="newPassword">New password</label><div class="password-row"><input id="newPassword" type="password" minlength="8" required><button type="button" class="show" data-target="newPassword">Show</button></div><button class="mt-6 bg-[#FF5A1F] px-5 py-4 font-extrabold text-[#1E293B]">Reset password</button></form></details><p id="message" class="mt-7 font-bold" role="status"></p></section></main><script>const $=id=>document.getElementById(id);const send=async(url,body)=>{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.detail||'Request failed');return data};document.querySelectorAll('.show').forEach(button=>button.onclick=()=>{const field=$(button.dataset.target);field.type=field.type==='password'?'text':'password';button.textContent=field.type==='password'?'Show':'Hide'});$('register').onsubmit=async e=>{e.preventDefault();try{const d=await send('/api/auth/register',{name:$('name').value,password:$('password').value,role:$('role').value,latitude:+$('lat').value,longitude:+$('lon').value,skills:$('skills').value.split(',').map(x=>x.trim()).filter(Boolean),certifications:$('certs').value.split(',').map(x=>x.trim()).filter(Boolean)});$('message').textContent='Account created. Save this recovery code: '+d.recovery_code}catch(err){$('message').textContent=err.message}};$('login').onsubmit=async e=>{e.preventDefault();try{const d=await send('/api/auth/login',{name:$('loginName').value,password:$('loginPassword').value});localStorage.setItem('helperchore_user',JSON.stringify(d));location.href=d.role==='SENIOR'?'/senior.html':'/volunteer.html'}catch(err){$('message').textContent=err.message}};$('reset').onsubmit=async e=>{e.preventDefault();try{await send('/api/auth/reset-password',{name:$('resetName').value,recovery_code:$('recovery').value,new_password:$('newPassword').value});$('message').textContent='Password reset. You can sign in now.'}catch(err){$('message').textContent=err.message}}</script></body></html>
