<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HelperChore | Volunteer workspace</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet"><style>:root{font-size:20px}body{margin:0;background:#1E293B;color:#F8FAFC;font-family:'Plus Jakarta Sans',sans-serif}h1,h2{font-family:'Playfair Display',serif}label{display:block;margin-top:18px;font-weight:800}input,textarea{width:100%;min-height:52px;margin-top:7px;padding:10px;background:#F8FAFC;color:#1E293B;border:2px solid #FF5A1F}button,a{min-width:48px;min-height:48px}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid #FF5A1F;outline-offset:3px}</style></head><body><header class="border-b-4 border-[#FF5A1F] px-6 py-6"><div class="mx-auto flex max-w-6xl justify-between"><a href="/" class="font-extrabold tracking-widest">HELPER<span class="text-[#FF5A1F]">/</span>CHORE</a><a href="/auth.html">Sign out</a></div></header><main class="mx-auto max-w-6xl px-6 py-12"><h1 class="text-6xl">Work with context.</h1><section class="mt-10 bg-[#F8FAFC] p-8 text-[#1E293B]"><h2 class="text-4xl">Find a good fit</h2><form id="match" class="max-w-xl"><label for="chore">Chore ID</label><input id="chore" required><button class="mt-7 bg-[#FF5A1F] px-5 py-4 font-extrabold" type="submit">Show matches</button></form><pre id="matches" class="mt-7 whitespace-pre-wrap"></pre></section><div class="mt-10 grid gap-10 md:grid-cols-2"><section class="border-l-4 border-[#FF5A1F] p-8"><h2 class="text-4xl">Ask the copilot</h2><form id="ask"><label for="askChore">Chore ID</label><input id="askChore" required><label for="volunteer">Your volunteer ID</label><input id="volunteer" required><label for="question">Your question</label><textarea id="question" required></textarea><button class="mt-7 bg-[#FF5A1F] px-5 py-4 font-extrabold text-[#1E293B]">Ask safely</button></form><p id="answer" class="mt-6 whitespace-pre-wrap" role="status"></p></section><section class="border-l-4 border-[#FF5A1F] p-8"><h2 class="text-4xl">Your points</h2><p class="mt-6 text-5xl text-[#FF5A1F]" id="balance">Sign in to view</p><form id="redeem"><label for="user">Your ID</label><input id="user" required><label for="reward">Reward name</label><input id="reward" required><label for="cost">Points cost</label><input id="cost" type="number" min="1" required><button class="mt-7 bg-[#FF5A1F] px-5 py-4 font-extrabold text-[#1E293B]">Redeem</button></form></section></div></main><script>const $=id=>document.getElementById(id);$('match').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/chores/'+$('chore').value+'/match',{method:'POST'});$('matches').textContent=JSON.stringify(await r.json(),null,2)};$('ask').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/chores/'+$('askChore').value+'/volunteer-copilot-help',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({volunteer_id:$('volunteer').value,question:$('question').value})});$('answer').textContent=JSON.stringify(await r.json(),null,2)};$('redeem').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/redeem-rewards',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:$('user').value,reward_name:$('reward').value,points_cost:+$('cost').value})});const d=await r.json();$('balance').textContent=d.remaining_points??d.detail}</script></body></html>
