<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HelperChore | Senior workspace</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet"><style>:root{font-size:20px}body{margin:0;background:#1E293B;color:#F8FAFC;font-family:'Plus Jakarta Sans',sans-serif}h1,h2{font-family:'Playfair Display',serif}label{display:block;margin-top:18px;font-weight:800}input,textarea{width:100%;min-height:52px;margin-top:7px;padding:10px;background:#F8FAFC;color:#1E293B;border:2px solid #FF5A1F}button,a{min-width:48px;min-height:48px}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid #FF5A1F;outline-offset:3px}</style></head><body><header class="border-b-4 border-[#FF5A1F] px-6 py-6"><div class="mx-auto flex max-w-6xl justify-between"><a href="/" class="font-extrabold tracking-widest">HELPER<span class="text-[#FF5A1F]">/</span>CHORE</a><a href="/auth.html">Sign out</a></div></header><main class="mx-auto max-w-6xl px-6 py-12"><h1 class="text-6xl">Your task desk.</h1><div class="mt-10 grid gap-10 md:grid-cols-2"><section class="bg-[#F8FAFC] p-8 text-[#1E293B]"><h2 class="text-4xl">Start a chore</h2><form id="draft"><label for="chore">Chore ID</label><input id="chore" required><label for="photo">Photo of the work</label><input id="photo" type="file" accept="image/*" required><button class="mt-7 bg-[#FF5A1F] px-5 py-4 font-extrabold" type="submit">Draft steps</button></form><pre id="steps" class="mt-7 whitespace-pre-wrap" role="status"></pre></section><section class="border-l-4 border-[#FF5A1F] p-8"><h2 class="text-4xl">Add your instructions</h2><form id="refine"><label for="refineId">Chore ID</label><input id="refineId" required><label for="seniorId">Your resident ID</label><input id="seniorId" required><label for="text">Requirements or safety warning</label><textarea id="text" required></textarea><button class="mt-7 bg-[#FF5A1F] px-5 py-4 font-extrabold text-[#1E293B]">Save instruction</button></form><p id="result" class="mt-6" role="status"></p></section></div><section class="border-t-4 border-[#FF5A1F] py-12"><h2 class="text-4xl">Check a volunteer</h2><form id="arrival" class="max-w-xl"><label for="arrivalId">Chore ID</label><input id="arrivalId" required><label for="seniorArrival">Your resident ID</label><input id="seniorArrival" required><button class="mt-7 mr-3 bg-[#FF5A1F] px-5 py-4 font-extrabold" data-approved="true">Approve arrival</button><button class="mt-7 border-2 border-[#FF5A1F] px-5 py-4" data-approved="false">Reject arrival</button></form></section></main><script>const $=id=>document.getElementById(id);$('draft').onsubmit=async e=>{e.preventDefault();const form=new FormData();form.append('chore_id',$('chore').value);form.append('image',$('photo').files[0]);const r=await fetch('/api/chores/draft-ai-steps',{method:'POST',body:form});$('steps').textContent=JSON.stringify(await r.json(),null,2)};$('refine').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/chores/'+$('refineId').value+'/senior-refinement',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({senior_id:$('seniorId').value,refinement_text:$('text').value})});$('result').textContent=JSON.stringify(await r.json())};$('arrival').onclick=async e=>{if(e.target.tagName!=='BUTTON')return;e.preventDefault();const r=await fetch('/api/chores/'+$('arrivalId').value+'/verify-arrival',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({senior_id:$('seniorArrival').value,approved:e.target.dataset.approved==='true'})});$('result').textContent=JSON.stringify(await r.json())}</script></body></html>
