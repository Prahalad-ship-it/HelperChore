<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HelperChore | Admin board</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet"><style>:root{font-size:20px}body{margin:0;background:#1E293B;color:#F8FAFC;font-family:'Plus Jakarta Sans',sans-serif}h1,h2{font-family:'Playfair Display',serif}button,a{min-width:48px;min-height:48px}button:focus-visible,a:focus-visible{outline:4px solid #FF5A1F;outline-offset:3px}</style></head><body><header class="border-b-4 border-[#FF5A1F] px-6 py-6"><div class="mx-auto flex max-w-6xl justify-between"><a href="/" class="font-extrabold tracking-widest">HELPER<span class="text-[#FF5A1F]">/</span>CHORE</a><a href="/auth.html">Sign out</a></div></header><main class="mx-auto max-w-6xl px-6 py-12"><h1 class="text-6xl">Dispute board.</h1><p class="mt-5 max-w-2xl text-slate-200">Review reports, the people involved, and the evidence path before resolving a claim.</p><button id="load" class="mt-8 bg-[#FF5A1F] px-6 py-4 font-extrabold text-[#1E293B]">Load disputed chores</button><section id="rows" class="mt-10 grid gap-5"></section></main><script>const rows=document.getElementById('rows');document.getElementById('load').onclick=async()=>{const r=await fetch('/api/admin/disputes');const data=await r.json();rows.innerHTML='';if(!data.length){rows.textContent='No disputed chores.';return}data.forEach(item=>{const article=document.createElement('article');article.className='border-2 border-[#FF5A1F] bg-[#F8FAFC] p-6 text-[#1E293B]';article.innerHTML='<h2 class="text-3xl">Chore '+item.chore_id+'</h2><p class="mt-3"><b>Accused:</b> '+item.accused+'</p><p><b>Reason:</b> '+item.reason+'</p><p><b>Details:</b> '+item.description+'</p><p class="mt-3 break-all text-sm"><b>Evidence:</b> '+item.proof_path+'</p>';rows.appendChild(article)})}</script></body></html>
